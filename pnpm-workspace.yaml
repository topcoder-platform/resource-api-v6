overrides:
  '@topcoder-platform/topcoder-bus-api-wrapper>tc-core-library-js': https://codeload.github.com/topcoder-platform/tc-core-library-js/tar.gz/1075136355e1e1c4779f2138a30f3ffbd718bfa4
  '@hono/node-server@<1.19.13': 1.19.13
  'axios@<1.18.1': 1.18.1
  'brace-expansion@1.1.12': 1.1.13
  'follow-redirects@<1.16.0': 1.16.0
  'form-data@<4.0.6': 4.0.6
  'minimatch@3.1.2': 3.1.4
  'path-to-regexp@0.1.12': 0.1.13
  'qs@<6.15.2': 6.15.2

# The published Bus API wrapper intentionally resolves Topcoder's core library
# from its pinned GitHub archive rather than from the npm registry.
blockExoticSubdeps: false

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  '@scarf/scarf': false
  core-js: false
  dtrace-provider: false
