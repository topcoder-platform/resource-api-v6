version: 2.1
executors:
  reviewed:
    docker:
    - image: cimg/aws@sha256:4cf3768db00ddf9bc439b8c84e8a60c11a14edf81c8baf76f74132144f8340d5
commands:
  checkout-source:
    steps:
    - run:
        name: Check out the exact public source commit over HTTPS
        command: |
          set -euo pipefail
          [[ "$CIRCLE_SHA1" =~ ^[0-9a-f]{40}$ ]]
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0
          git init --quiet .
          git remote add origin https://github.com/topcoder-platform/resource-api-v6.git
          git -c credential.helper= fetch --quiet --depth 1 origin "$CIRCLE_SHA1"
          git checkout --quiet --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$CIRCLE_SHA1"
  checkout-suite:
    steps:
    - run:
        name: Verify deployment suite v2.0.6
        command: |
          set -euo pipefail
          git init --quiet /tmp/tc-deploy-scripts
          git -C /tmp/tc-deploy-scripts remote add origin https://github.com/topcoder-platform/tc-deploy-scripts.git
          git -C /tmp/tc-deploy-scripts fetch --quiet --depth 1 origin refs/tags/v2.0.6
          git -C /tmp/tc-deploy-scripts checkout --quiet --detach FETCH_HEAD
          test "$(git -C /tmp/tc-deploy-scripts rev-parse HEAD)" = 26aaf607463d4a271c0099854c1731214215a9c5
jobs:
  build:
    executor: reviewed
    steps:
    - checkout-source
    - setup_remote_docker
    - checkout-suite
    - run:
        name: Build committed source without AWS or broker credentials
        command: |
          set -euo pipefail
          python3 -I /tmp/tc-deploy-scripts/build_image.py --dockerfile docker/Dockerfile --image resource-api-v6:candidate
          mkdir -p /tmp/release
          docker save --output /tmp/release/image.tar resource-api-v6:candidate
        no_output_timeout: 30m
    - persist_to_workspace:
        root: /tmp/release
        paths:
        - image.tar
  deploy:
    executor: reviewed
    parameters:
      environment:
        type: enum
        enum:
        - dev
        - prod
    environment:
      DEPLOY_ENV: << parameters.environment >>
    steps:
    - checkout-source
    - setup_remote_docker
    - checkout-suite
    - attach_workspace:
        at: /tmp/release
    - run:
        name: Promote a scanned digest with repository-bound OIDC
        command: |
          set +x
          set -euo pipefail
          test -f "deploy/${DEPLOY_ENV}.json"
          docker load --input /tmp/release/image.tar
          python3 -I deploy/release.py "deploy/${DEPLOY_ENV}.json"
        no_output_timeout: 45m
  qa:
    docker:
    - image: cimg/node@sha256:2c1320ee6a256628f698938038700911276310d40cc9887cfc8f66ec0daa4343
      environment:
        DEPLOY_ENV: DEV
        LOGICAL_ENV: dev
        APPNAME: resources-api-v6
    steps:
    - checkout-source
    - restore_cache:
        keys:
        - pnpm-store-v1-{{ checksum "pnpm-lock.yaml" }}
        - pnpm-store-v1-
    - run:
        name: Install pnpm dependencies
        command: |
          sudo npm install --global pnpm@11.15.1
          pnpm install --frozen-lockfile
          pnpm build
    - save_cache:
        key: pnpm-store-v1-{{ checksum "pnpm-lock.yaml" }}
        paths:
        - ~/.local/share/pnpm/store
    - run:
        name: Newman test
        command: |
          set +x
          set -euo pipefail
          : "${DATABASE_URL:?Set isolated QA database settings in the restricted QA context}"
          : "${AUTH0_CLIENT_SECRET:?Set test-only Auth0 settings in the restricted QA context}"
          pnpm run mock-challenge-api > /tmp/mock-challenge-api.log 2>&1 &
          mock_pid=$!
          NODE_ENV=test pnpm start > /tmp/resource-api.log 2>&1 &
          app_pid=$!
          trap 'kill "$mock_pid" "$app_pid" 2>/dev/null || true' EXIT

          health_url="http://localhost:${PORT:-3000}/${API_VERSION:-v6}/resources/health"
          for attempt in $(seq 1 30); do
            if curl --fail --silent "$health_url" > /dev/null; then
              break
            fi
            if [[ "$attempt" == 30 ]]; then
              exit 1
            fi
            sleep 1
          done

          pnpm run test:newman:clear
          pnpm run test:newman
          pnpm run test:newman:clear
    - store_artifacts:
        path: ./newman
workflows:
  release:
    jobs:
    - build
    - deploy:
        name: deploy-dev
        environment: dev
        requires:
        - build
        context: resource-api-v6-dev-deploy
        serial-group: << pipeline.project.slug >>/deploy-dev
        filters:
          branches:
            only: develop
          tags:
            ignore: /.*/
    - approve-prod:
        type: approval
        requires:
        - build
        filters:
          branches:
            only: master
          tags:
            ignore: /.*/
    - deploy:
        name: deploy-prod
        environment: prod
        requires:
        - approve-prod
        context: resource-api-v6-prod-deploy
        serial-group: << pipeline.project.slug >>/deploy-prod
        filters:
          branches:
            only: master
          tags:
            ignore: /.*/
    - approve-qa:
        type: approval
        requires:
        - deploy-dev
        filters:
          branches:
            only: develop
          tags:
            ignore: /.*/
    - qa:
        requires:
        - approve-qa
        context: resource-api-v6-qa
        filters:
          branches:
            only: develop
          tags:
            ignore: /.*/
